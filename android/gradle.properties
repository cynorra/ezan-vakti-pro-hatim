# Project-wide Gradle settings.
org.gradle.daemon=false

# JVM bellek limitini art?r?yoruz
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# NDK ve Gradle paralel i?lemlerini k?s?tl?yoruz (Windows bellek çökmesini önlemek için kritik)
android.experimental.sdk.max.ndk.compiler.jobs=1
org.gradle.parallel=false
org.gradle.workers.max=1

# AndroidX ve Target mimari ayarlar?
android.useAndroidX=true
android.enablePngCrunchInReleaseBuilds=true
reactNativeArchitectures=arm64-v8a
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true

# Expo ve di?er ayarlar
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false
EX_DEV_CLIENT_NETWORK_INSPECTOR=true
expo.useLegacyPackaging=false
